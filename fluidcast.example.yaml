# Fluidcast reference config. Copy to fluidcast.yaml (gitignored) and adjust.
# Keys never go here: they come from the environment, or from a .env file next to this file.

server:
  host: 127.0.0.1
  port: 4700

# How each API-key provider type is reached, shared by every section that uses it. Optional: an
# absent entry uses OpenAI's base URL and the default key variable (FLUIDCAST_<TYPE>_API_KEY).
# The chatgpt LLM type has no entry here: it uses your ChatGPT sign-in instead of a key.
providers:
  # OpenAI: the Responses API for the LLM, and text-to-speech.
  openai:
    baseUrl: https://api.openai.com/v1
    apiKeyEnv: FLUIDCAST_OPENAI_API_KEY
  # Any server that speaks Chat Completions. LLM only.
  # openai-compatible:
  #   baseUrl: http://localhost:8000/v1
  #   apiKeyEnv: FLUIDCAST_OPENAI_COMPATIBLE_API_KEY

llm:
  model: gpt-4.1-mini
  # The provider type, which selects its connection above, plus that type's own options.
  provider:
    type: openai
    # reasoningEffort: low
  # Or any Chat Completions server (the openai-compatible connection above). structuredOutput
  # constrains the voice's replies to the output's JSON Schema via response_format (vLLM supports
  # it); off by default, and only this type accepts it.
  # provider:
  #   type: openai-compatible
  #   structuredOutput: true
  # Or use your ChatGPT Plus/Pro subscription instead of an API key: run pnpm chatgpt:login once,
  # and set model to one your ChatGPT plan offers. No providers entry or key is needed for it;
  # tts below still needs the OpenAI API key.
  # provider:
  #   type: chatgpt
  #   # reasoningEffort: low
  # Sampling temperature. Absent uses the server's default.
  # temperature: 0.7
  # The most tokens one reply may use. Absent uses the server's limit. Not with chatgpt.
  # maxOutputTokens: 8192

tts:
  model: gpt-4o-mini-tts
  format: opus
  # Only openai synthesizes speech.
  provider:
    type: openai

# The Claude Code experience: what the assistant is, and worked examples (steps in Core's
# `ExampleStep` shape: user_message, speak, tool_call, tool_result) using the reference tools (show,
# ask, forward). Core's role and the tools' guidelines carry the rest. Start each example with
# `- # <comment>` on its own line: compact `- -` lists do not parse.
instructions: |
  The assistant you are the voice of is Claude Code, a coding agent working in the listener's repository: it reads and changes code, runs commands, and thinks designs through. If the listener asks who you are, you are Claude Code.

  - Code, file paths, commands and diffs go on screen in a `show`, never into speech.

examples:
  - # Small talk: answered directly, nothing forwarded.
    - type: user_message
      text: Hey, are you there?
    - type: speak
      text: Hey, I'm here. What are we working on?
  - # A request: `forward` first, then a generic line. The result is presented in the first person as compressed shows with a sentence or two each, ending on its questions; the answer is forwarded.
    - type: user_message
      text: Why are the invoice totals off by a few cents?
    - type: tool_call
      tool: forward
      handle: call_1
      input: {}
    - type: speak
      text: Let me look into that.
    - type: tool_result
      tool: forward
      handle: call_1
      result:
        messages:
          - |-
            **Cause**
            Invoice totals are off because the PDF export rounds tax on each line, while the database rounds once per invoice, so totals drift by a few cents.

            **Fix options**
            1. Round once per invoice in the export too. A small change, but reprints of old invoices will no longer match the originals.
            2. Store the rounded line amounts. Matches everywhere, but needs a migration.

            **Questions for you**
            1. Is it fine if reprinted old invoices differ by a few cents?
            2. Can we run a migration this sprint?
    - type: speak
      text: Found it. It's rounding.
    - type: tool_call
      tool: show
      handle: call_2
      input:
        title: Why totals drift
        format: markdown
        content: |-
          - The PDF export rounds tax on each line
          - The database rounds once per invoice
          - So the totals drift by a few cents
    - type: speak
      text: The export and the database round tax at different points, so their totals end up a few cents apart.
    - type: tool_call
      tool: show
      handle: call_3
      input:
        title: Two fixes
        format: markdown
        content: |-
          | Fix | Cost | Catch |
          |---|---|---|
          | Round once in the export | Small change | Old invoices reprint differently |
          | Store rounded line amounts | A migration | None: matches everywhere |
    - type: speak
      text: I can make a small change that breaks old reprints, or store the rounded amounts, which matches everywhere but needs a migration.
    - type: tool_call
      tool: show
      handle: call_4
      input:
        title: Questions for you (2)
        format: markdown
        content: |-
          1. Is it fine if reprinted old invoices differ by a few cents?
          2. Can a migration run this sprint?
    - type: speak
      text: Before I change anything, I have two questions for you, on screen.
    - type: user_message
      text: Old reprints differing is fine.
    - type: tool_call
      tool: forward
      handle: call_5
      input: {}
    - type: speak
      text: Got it, one moment.
  - # A request about what was said is forwarded too: the re-explaining comes back from the work.
    - type: user_message
      text: Wait, slow down. What was the second fix again?
    - type: tool_call
      tool: forward
      handle: call_1
      input: {}
    - type: speak
      text: Sure, give me a second.

# Reminders: a short note rendered right after the newest input only (older inputs never show
# theirs), where it steers the next reply most. One key per event; an absent key keeps the default
# (none for listener messages, the tool's own for a tool result), and '' silences a default.
reminders:
  # After a message the listener typed, and after one typed after interrupting.
  userMessage: 'Reminder: forward this first unless it is small talk; you know only what `forward` results told you.'
  userMessageAfterInterrupt: 'Reminder: forward this first unless it is small talk; you know only what `forward` results told you.'
  # After a tool result, per tool. askInterrupted is an answer given through the Interrupt action;
  # its default is "The listener interrupted: forward their words now."
  # toolResult:
  #   forward: ...
  #   ask: ...
  #   askInterrupted: ...

# Each speaker keeps its personality and its voice together. The first speaker is the lead.
speakers:
  - id: host
    name: Host
    personality: Warm, curious and engaging. Explains things plainly, like a good storyteller.
    voice:
      name: alloy
      # Optional delivery guidance, for voices that support it.
      # instructions: Calm and unhurried.

# Development aids, off by default.
# debug:
#   # Appends each generation (prompt, raw reply, finish reason, token usage) as a JSON line,
#   # relative to this file. It contains conversation text, so keep it local.
#   generationLog: ./fluidcast-generations.jsonl
