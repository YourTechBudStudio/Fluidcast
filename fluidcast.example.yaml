# Fluidcast reference config. Copy to fluidcast.yaml (gitignored) and adjust.
# Keys never go here: they come from the environment, or from a .env file next to this file.

server:
  host: 127.0.0.1
  port: 4700

# How each API-key provider type is reached, shared by every section that uses it. Optional: an
# absent entry uses the provider's own base URL and the default key variable
# (FLUIDCAST_<TYPE>_API_KEY).
# The chatgpt LLM type has no entry here: it uses your ChatGPT sign-in instead of a key.
providers:
  # OpenAI: the Responses API for the LLM, and text-to-speech.
  openai:
    baseUrl: https://api.openai.com/v1
    apiKeyEnv: FLUIDCAST_OPENAI_API_KEY
  # Any server that speaks Chat Completions. LLM only.
  # openai-compatible:
  #   baseUrl: http://localhost:8000/v1
  #   apiKeyEnv: FLUIDCAST_OPENAI_COMPATIBLE_API_KEY
  # Anthropic's Messages API, with a Claude Platform (console) API key. LLM only.
  # anthropic:
  #   baseUrl: https://api.anthropic.com
  #   apiKeyEnv: FLUIDCAST_ANTHROPIC_API_KEY

# The models. voice writes the conversation; summary is an optional, cheaper helper.
llm:
  voice:
    model: gpt-4.1-mini
    # The provider type, which selects its connection above, plus that type's own options.
    provider:
      type: openai
      # reasoningEffort: low
    # Or any Chat Completions server (the openai-compatible connection above). structuredOutput
    # constrains the voice's replies to the output's JSON Schema via response_format (vLLM supports
    # it); off by default, and only this type accepts it. With vLLM, start the server with
    # structured-output whitespace disabled (disable_any_whitespace), or a stray quote can turn into
    # a long run of spaces.
    # provider:
    #   type: openai-compatible
    #   structuredOutput: true
    # Or use your ChatGPT Plus/Pro subscription instead of an API key: run pnpm chatgpt:login once,
    # and set model to one your ChatGPT plan offers. No providers entry or key is needed for it;
    # tts below still needs the OpenAI API key.
    # provider:
    #   type: chatgpt
    #   # reasoningEffort: low
    # Or Anthropic (the anthropic connection above), with an exact model ID such as
    # claude-sonnet-5-5, claude-haiku-5-5 or claude-opus-5-5. Prompt caching is automatic.
    # temperature is not accepted. reasoningEffort is low, medium, high, xhigh or max; absent uses the model's
    # default. speed: fast is fast mode: Opus models only, premium-priced, with its own rate limit.
    # Thinking counts against maxOutputTokens, so a small value can produce empty replies.
    # model: claude-sonnet-5-5
    # provider:
    #   type: anthropic
    #   reasoningEffort: low
    #   # speed: fast
    # Sampling temperature. Absent uses the server's default. Not with anthropic.
    # temperature: 0.7
    # The most tokens one reply may use. Absent uses the server's limit. Not with chatgpt.
    # maxOutputTokens: 8192

  # Optional: a second model that writes the forward_agent tool's progress sentences and the
  # history summaries below. Same settings as voice, except structuredOutput (its replies are plain
  # text). Absent: the voice model writes both. It cannot be a second chatgpt sign-in beside a
  # chatgpt voice. On paid APIs with cheap cache reads, such as Anthropic, compaction costs more
  # than it saves unless a cheap model writes the summaries or the threshold is high.
  # summary:
  #   model: claude-haiku-5-5
  #   provider:
  #     type: anthropic

tts:
  model: gpt-4o-mini-tts
  format: opus
  # Only openai synthesizes speech.
  provider:
    type: openai

# The voice's behavior: the Guided Walkthrough preset. The agent behind the forward_agent tool does
# the thinking, and the voice walks you through its work one segment at a time.
preset:
  # detailed: for smaller or local models such as Qwen. The tested profile, and the default.
  # compact: the protocol alone, for frontier models. Untested.
  profile: detailed
  # The host's synthesized voice, in the speech provider's names.
  voice:
    name: alloy
    # Optional delivery guidance, for voices that support it.
    # instructions: Calm and unhurried.

# How the voice's history is kept. Off unless enabled.
# history:
#   # Compaction: once the generation that writes a forward_agent call reads more than
#   # aboveInputTokens of input (the total, including cache reads), everything before that episode
#   # is replaced, for the voice only, by one rolling summary. The listener, the transcript and the
#   # agent still get the full conversation. The default, 50000, keeps the total input under 64K. If
#   # the provider reports no count, every forward compacts. llm.summary writes the summaries.
#   compaction:
#     enabled: true
#     aboveInputTokens: 50000

# The agents behind the forward_agent tool: Claude Code or Codex, picked on the mode screen for each
# session. Both run the CLI installed on this machine (`claude`, `codex app-server`).
# workers:
#   # Where a new brainstorm's worker runs, relative to this file. Default: this file's directory.
#   # A continued session runs in its own recorded directory.
#   cwd: .
#   claude:
#     # The model for new sessions. Absent: Claude Code's default. A continued session keeps its own.
#     model: opus
#     # Effort for new sessions (low, medium, high, xhigh, max). A continued session uses the effort
#     # it last ran with, and this when none is recorded.
#     effort: high
#   codex:
#     # The model for new sessions. Absent: Codex's default. A continued session keeps its own.
#     model: gpt-6.1-sol
#     # Reasoning effort for new sessions; the levels depend on the model. A continued session uses
#     # the effort it last ran with, and this when none is recorded.
#     effort: high

# Development aids, off by default.
# debug:
#   # Appends each generation (prompt, raw reply, finish reason, token usage) as a JSON line,
#   # relative to this file. It contains conversation text, so keep it local.
#   generationLog: ./fluidcast-generations.jsonl
