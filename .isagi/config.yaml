worktrees:
  hooks:
    postCreate:
      - type: command
        run: pnpm install
        cwd: .
        timeout: 10m
commands:
  - name: dev
    command: pnpm dev
    ports:
      - envVar: FLUIDCAST_PORT
      - envVar: FLUIDCAST_WEB_PORT
        paths:
          - label: app
            path: /
    lifecycle:
      deactivate:
        stop: false
